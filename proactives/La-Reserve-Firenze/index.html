<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Réserve Firenze | Quintessentially</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#050505;
  color:#e8e2d8;
}

body{
  font-family:Georgia, "Times New Roman", serif;
  line-height:1.65;
}

.page{
  width:100%;
  padding:30px 20px 70px;
}

.container{
  width:100%;
  max-width:760px;
  margin:0 auto;
}


/* =========================
   HEADER
========================= */

.header{
  text-align:center;
  margin-bottom:30px;
}


/* TRANSLATION BUTTONS */

.languages{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;

  margin-bottom:18px;

  font-family:Arial, Helvetica, sans-serif;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.languages button{
  border:0;
  background:none;

  padding:3px 5px;

  color:#716b61;

  cursor:pointer;

  font-family:Arial, Helvetica, sans-serif;
  font-size:9px;
}

.languages button:hover{
  color:#a88a4b;
}

.languages button.active{
  color:#d3b06a;
}

.languages span{
  color:#40392e;
}


/* QUINTESSENTIALLY */

.brand{
  font-family:Arial, Helvetica, sans-serif;
  font-size:42px;
  font-weight:400;
  letter-spacing:.30em;
  line-height:1.1;

  color:#ffffff;

  text-transform:uppercase;
}


/* =========================
   IMAGES
========================= */

img{
  display:block !important;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;

  padding:0 !important;

  background:#050505 !important;
}

.image-block{
  position:relative;

  display:block;

  width:88%;

  margin:32px auto 31px;
  padding:0;

  overflow:hidden;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;

  background:#050505 !important;

  line-height:0;
}

.image-block.first{
  margin-top:0;
}

.image-block .full-image{
  display:block !important;

  width:calc(100% + 6px) !important;
  max-width:none !important;
  height:auto !important;

  position:relative;

  left:-3px;
  top:-3px;

  margin:0 0 -6px 0 !important;
  padding:0 !important;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;

  background:#050505 !important;
}


/* =========================
   MAIN TITLE
========================= */

.intro-title{
  text-align:center;

  padding:24px 20px 27px;
}

.intro-title h1{
  margin:0 0 5px;

  color:#f3eee6;

  font-size:34px;
  line-height:1.15;
  font-weight:400;
}

.intro-title .subtitle{
  margin:0;

  color:#d3b06a;

  font-size:16px;
  line-height:1.4;

  font-style:italic;
  font-weight:400;
}


/* =========================
   TEXT
========================= */

.text{
  width:100%;
  max-width:650px;

  margin:0 auto;

  text-align:left;
}

.text p{
  margin:0 0 19px;

  font-size:16px;
  line-height:1.72;

  color:#cfc8bd;
}

.text strong{
  color:#e7e0d6;
  font-weight:600;
}


/* =========================
   SECTION TITLES
========================= */

.section-title{
  display:flex;
  align-items:center;

  width:100%;
  max-width:650px;

  gap:16px;

  margin:31px auto 15px;
}

.section-title h2{
  margin:0;

  white-space:nowrap;

  color:#eee7dc;

  font-size:22px;
  line-height:1.25;

  font-weight:400;
  font-style:italic;
}

.section-title .line{
  height:1px;
  flex:1;

  background:#332b20;
}


/* =========================
   ADDRESS
========================= */

.details{
  width:100%;
  max-width:650px;

  margin:31px auto 0;
  padding:21px 0;

  border-top:1px solid #332b20;
  border-bottom:1px solid #332b20;
}

.details p{
  margin:0;

  color:#cfc8bd;

  font-size:15px;
}

.details strong{
  color:#eee7dc;
}


/* =========================
   CLOSING
========================= */

.closing{
  margin-top:29px;
  text-align:center;
}

.closing-line{
  color:#eee7dc !important;

  font-size:19px !important;
  font-style:italic;
}

.contact{
  display:inline-block;

  margin-top:5px;
  padding-bottom:4px;

  color:#d3b06a;

  font-family:Arial, Helvetica, sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.17em;

  text-transform:uppercase;
  text-decoration:none;

  border-bottom:1px solid #d3b06a;
}

.contact:hover{
  color:#e2c27d;
  border-color:#e2c27d;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .page{
    padding:25px 18px 50px;
  }

  .header{
    margin-bottom:23px;
  }

  .languages{
    margin-bottom:15px;
  }

  .brand{
    font-size:27px;
    letter-spacing:.25em;
    line-height:1.15;
  }

  .image-block{
    width:100%;
  }

  .intro-title{
    padding:20px 10px 23px;
  }

  .intro-title h1{
    font-size:29px;
  }

  .intro-title .subtitle{
    font-size:15px;
  }

  .text p{
    font-size:15px;
  }

  .section-title h2{
    font-size:19px;
    white-space:normal;
  }

}

</style>
</head>


<body>

<div class="page">

<main class="container">


<!-- =========================
     HEADER
========================= -->

<header class="header">


  <!-- TRANSLATIONS -->

  <div class="languages">

    <button data-lang="fr">
      FR
    </button>

    <span>·</span>

    <button data-lang="en">
      EN
    </button>

    <span>·</span>

    <button data-lang="nl">
      NL
    </button>

  </div>


  <!-- LOGO -->

  <div class="brand">
    QUINTESSENTIALLY
  </div>


</header>


<!-- =========================
     IMAGE 1
========================= -->

<div class="image-block first">

  <img
    src="la reserve 1.jpg"
    alt="La Réserve Firenze"
    class="full-image"
  >

</div>


<!-- =========================
     TITLE
========================= -->

<div class="intro-title">

  <h1 id="mainTitle">
    La Réserve Firenze
  </h1>

  <p
    class="subtitle"
    id="mainSubtitle">
    A Private Residence in the Heart of Florence
  </p>

</div>


<!-- =========================
     ARTICLE
========================= -->

<div id="articleContent"></div>


</main>

</div>


<script>


/* ==========================================================
   TRANSLATIONS
========================================================== */

const translations = {


/* =========================
   ENGLISH
========================= */

en:{

  title:
    "La Réserve Firenze",

  subtitle:
    "A Private Residence in the Heart of Florence",

  intro:`

  `,

  renaissanceTitle:
    "Renaissance Grandeur, Reimagined",

  renaissance1:`

  `,

  privacyTitle:
    "The Privacy of a Residence",

  privacy1:`

    stay, while a private chef can prepare dinner at home using ingredients
    sourced from the nearby Santo Spirito market.
  `,

  privacy2:`
    Guests can also retreat to the library and garden patio or enjoy an evening
    aperitivo on the shared terrace overlooking Santo Spirito and the Pitti
    Palace.
  `,

  florenceTitle:
    "Florence, at Your Own Pace",

  florence1:`
    Step outside and the galleries, boutiques and hidden addresses of Oltrarno
    are close at hand. Return, and La Réserve Firenze becomes your own quiet
    corner of the city — private, elegant and unmistakably Florentine.
  `,

  florence2:`
    Whether for a few days or a longer Tuscan escape, every stay can be shaped
    around how you wish to experience Florence.
  `,

  addressLabel:
    "Address:",

  address:
    "Via Santo Spirito 6, 50125 Florence, Italy",

  closing:
    "Make Florence feel like your own.",

  contact:
    "Contact me for more information"

},


/* =========================
   FRENCH
========================= */

fr:{

  title:
    "La Réserve Firenze",

  subtitle:
    "Une résidence privée au cœur de Florence",

  intro:`
    Cet octobre, La Réserve Firenze propose une manière plus intime de
    découvrir la capitale toscane. Installée dans un magnifique palais du
    XVe siècle restauré au cœur de l’Oltrarno, La Réserve Firenze ne compte
    que six appartements privés. Chacun associe l’intimité d’une résidence
    florentine à un service attentionné, à quelques pas des trésors culturels

  `,

  renaissanceTitle:
    "La grandeur de la Renaissance, réinventée",

  renaissance1:`
    Restauré par le célèbre duo de designers d’intérieur Gilles &amp; Boissier,

  `,

  renaissance2:`
    Les six résidences vont d’un appartement intime d’une chambre à un duplex

    son propre caractère et son lien particulier avec la ville.
  `,

  privacyTitle:
    "L’intimité d’une résidence",

  privacy1:`
    Ici, l’indépendance d’un appartement privé s’accompagne d’un service
    attentionné. Un majordome, une gouvernante et un concierge sont disponibles

    domicile à partir de produits provenant du marché voisin de Santo Spirito.
  `,

  privacy2:`
    Les hôtes peuvent également se retirer dans la bibliothèque et le
    patio-jardin, ou savourer un aperitivo en soirée sur la terrasse commune
    avec vue sur Santo Spirito et le palais Pitti.
  `,

  florenceTitle:
    "Florence, à votre rythme",

  florence1:`
    Sortez, et les galeries, boutiques et adresses confidentielles de
    l’Oltrarno sont à portée de main. À votre retour, La Réserve Firenze devient
    votre propre refuge au cœur de la ville — privé, élégant et résolument
    florentin.
  `,

  florence2:`
    Que ce soit pour quelques jours ou pour une escapade toscane plus longue,
    chaque séjour peut être imaginé selon votre manière de découvrir Florence.
  `,

  addressLabel:
    "Adresse :",

  address:
    "Via Santo Spirito 6, 50125 Florence, Italie",

  closing:
    "Faites de Florence votre propre ville.",

  contact:
    "Contactez-moi pour plus d’informations"

},


/* =========================
   DUTCH
========================= */

nl:{

  title:
    "La Réserve Firenze",

  subtitle:
    "Een privéresidentie in het hart van Florence",

  intro:`
    Deze oktober introduceert La Réserve Firenze een intiemere manier om de
    Toscaanse hoofdstad te beleven. Gevestigd in een prachtig gerestaureerd
    15e-eeuws palazzo in Oltrarno, biedt La Réserve Firenze slechts zes
    privéappartementen. Elk combineert de privacy van een Florentijnse

    van de stad.
  `,

  renaissanceTitle:
    "Renaissancegrandeur, opnieuw geïnterpreteerd",

  renaissance1:`
    Het palazzo werd gerestaureerd door het gerenommeerde interieurduo
    Gilles &amp; Boissier en brengt renaissancekarakter samen met hedendaagse
    elegantie. Originele fresco’s en historische details geven elk appartement
    een eigen karakter, terwijl de verfijnde interieurs een gevoel van
    ingetogen luxe toevoegen.
  `,

  renaissance2:`
    De zes residenties variëren van een intiem appartement met één slaapkamer
    tot een duplex met drie slaapkamers en een privéterras van 55 m², elk met
    een eigen karakter en verbinding met de stad.
  `,

  privacyTitle:
    "De privacy van een residentie",

  privacy1:`
    Hier wordt de onafhankelijkheid van een privéappartement aangevuld met
    attente service. Een butler, housekeeper en conciërge staan gedurende het
    verblijf ter beschikking, terwijl een privéchef thuis het diner kan
    bereiden met ingrediënten van de nabijgelegen Santo Spirito-markt.
  `,

  privacy2:`
    Gasten kunnen zich ook terugtrekken in de bibliotheek en de tuinpatio,

  `,

  florenceTitle:
    "Florence, op uw eigen tempo",

  florence1:`
    Stap naar buiten en de galeries, boetieks en verborgen adressen van
    Oltrarno liggen binnen handbereik. Bij terugkomst wordt La Réserve Firenze
    uw eigen rustige plek in de stad — privé, elegant en onmiskenbaar
    Florentijns.
  `,

  florence2:`
    Of het nu voor enkele dagen is of voor een langer Toscaans verblijf,
    elk verblijf kan worden afgestemd op de manier waarop u Florence wilt
    beleven.
  `,

  addressLabel:
    "Adres:",

  address:
    "Via Santo Spirito 6, 50125 Florence, Italië",

  closing:
    "Laat Florence als uw eigen stad aanvoelen.",

  contact:
    "Neem contact met mij op voor meer informatie"

}

};


/* ==========================================================
   RENDER
========================================================== */

function renderLanguage(lang){

  if(!translations[lang]){
    lang="en";
  }

  const t=translations[lang];

  document.documentElement.lang=lang;


  /* TITLE */

  document
    .getElementById("mainTitle")
    .textContent=t.title;

  document
    .getElementById("mainSubtitle")
    .textContent=t.subtitle;


  /* ARTICLE */

  document
    .getElementById("articleContent")
    .innerHTML=`


      <!-- INTRO -->

      <div class="text">

        <p>
          ${t.intro}
        </p>

      </div>


      <!-- RENAISSANCE -->

      <div class="section-title">

        <h2>
          ${t.renaissanceTitle}
        </h2>

        <div class="line"></div>

      </div>


      <div class="text">

        <p>
          ${t.renaissance1}
        </p>

        <p>
          ${t.renaissance2}
        </p>

      </div>


      <!-- IMAGE 2 -->

      <div class="image-block">

        <img
          src="la reserve 2.jpg"
          alt="La Réserve Firenze residence"
          class="full-image"
        >

      </div>


      <!-- PRIVACY -->

      <div class="section-title">

        <h2>
          ${t.privacyTitle}
        </h2>

        <div class="line"></div>

      </div>


      <div class="text">

        <p>
          ${t.privacy1}
        </p>

        <p>
          ${t.privacy2}
        </p>

      </div>


      <!-- IMAGE 3 -->

      <div class="image-block">

        <img
          src="la reserve 3.jpg"
          alt="La Réserve Firenze in Florence"
          class="full-image"
        >

      </div>


      <!-- FLORENCE -->

      <div class="section-title">

        <h2>
          ${t.florenceTitle}
        </h2>

        <div class="line"></div>

      </div>


      <div class="text">

        <p>
          ${t.florence1}
        </p>

        <p>
          ${t.florence2}
        </p>

      </div>


      <!-- ADDRESS -->

      <div class="details">

        <p>

          <strong>
            ${t.addressLabel}
          </strong>

          ${t.address}

        </p>

      </div>


      <!-- CLOSING -->

      <div class="text closing">

        <p class="closing-line">
          ${t.closing}
        </p>

        <a
          class="contact"
          href="mailto:belgium@quintessentially.com"
        >
          ${t.contact} →
        </a>

      </div>

    `;


  /* ACTIVE LANGUAGE */

  document
    .querySelectorAll("[data-lang]")
    .forEach(function(button){

      button.classList.toggle(
        "active",
        button.dataset.lang===lang
      );

    });


  /* UPDATE URL */

  const url=
    new URL(window.location.href);

  url.searchParams.set(
    "lang",
    lang
  );

  window.history.replaceState(
    {},
    "",
    url
  );

}


/* ==========================================================
   LANGUAGE BUTTONS
========================================================== */

document
  .querySelectorAll("[data-lang]")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        renderLanguage(
          button.dataset.lang
        );

      }
    );

  });


/* ==========================================================
   START LANGUAGE
========================================================== */

const params=
  new URLSearchParams(
    window.location.search
  );

const initialLanguage=
  params.get("lang") || "en";

renderLanguage(
  initialLanguage
);

</script>

</body>
</html>
