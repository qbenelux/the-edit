<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Coastal Retreat · The Edit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#080807;
  --ink:#ece6db;
  --body:#b8b1a4;
  --muted:#8a8478;
  --line:#302819;
  --accent:#c9a961;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:Helvetica,Arial,sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--body);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
}


/* HEADER */

header{
  height:68px;
  background:#080807;
  border-bottom:1px solid #211d15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 36px;
  position:relative;
  z-index:10;
}

.wordmark{
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--ink);
}

.language{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.22em;
}

.language button{
  background:none;
  border:none;
  cursor:pointer;
  padding:6px 8px;
  color:var(--muted);
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.22em;
}

.language button.active{
  color:var(--accent);
  border-bottom:1px solid var(--accent);
}

.sep{
  color:#3a3120;
}

.edition{
  font-size:15px;
  font-style:italic;
  color:var(--ink);
}


/* HERO */

.hero{
  height:430px;
  position:relative;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(5,5,4,.08) 0%,
    rgba(5,5,4,.12) 45%,
    rgba(5,5,4,.82) 100%
  );
}

.hero-content{
  position:absolute;
  z-index:2;
  left:clamp(35px,6vw,80px);
  bottom:48px;
}

.category{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.35em;
  font-size:9px;
  color:var(--accent);
  margin-bottom:12px;
}

h1{
  color:var(--ink);
  font-size:clamp(46px,5vw,68px);
  font-weight:300;
  line-height:1;
}


/* ARTICLE */

.article{
  max-width:590px;
  margin:0 auto;
  padding:70px 30px 85px;
}

.article p{
  font-size:18px;
  line-height:1.75;
  margin-bottom:25px;
  color:var(--body);
}

.article p:first-child{
  color:var(--ink);
  font-size:20px;
}


/* MEMBER BENEFITS */

.benefits{
  margin:42px 0 38px;
  padding:30px 0 28px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.benefits-title{
  font-size:18px;
  line-height:1.6;
  font-weight:600;
  color:var(--ink);
  margin-bottom:18px;
}

.benefits ul{
  list-style:none;
  padding:0;
  margin:0;
}

.benefits li{
  position:relative;
  padding-left:20px;
  margin-bottom:13px;
  font-size:17px;
  line-height:1.55;
  color:var(--body);
}

.benefits li:last-child{
  margin-bottom:0;
}

.benefits li::before{
  content:"";
  position:absolute;
  left:0;
  top:.72em;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--accent);
}

.benefits strong{
  color:var(--ink);
  font-weight:500;
}


/* CTA */

.cta{
  display:inline-block;
  margin-top:4px;
  color:var(--accent);
  font-size:21px;
  font-style:italic;
  text-decoration:none;
  border-bottom:1px solid var(--line);
  padding-bottom:5px;
}

.cta:hover{
  border-color:var(--accent);
}


/* FOOTER */

footer{
  border-top:1px solid #211d15;
  text-align:center;
  padding:48px 20px;
}

.footer-logo{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.42em;
  font-size:9px;
  color:var(--ink);
  margin-bottom:15px;
}

.footer-edition{
  font-style:italic;
  color:var(--muted);
  font-size:16px;
  margin-bottom:18px;
}

.footer-small{
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.14em;
  color:#716b60;
}


/* MOBILE */

@media(max-width:600px){

  header{
    padding:0 18px;
    height:64px;
  }

  .edition{
    display:none;
  }

  .language{
    position:static;
    transform:none;
  }

  .hero{
    height:480px;
  }

  .hero-content{
    left:25px;
    right:25px;
    bottom:40px;
  }

  h1{
    font-size:46px;
  }

  .article{
    padding:55px 25px 70px;
  }

  .benefits{
    margin:35px 0 32px;
    padding:27px 0;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

  <div class="wordmark">Quintessentially</div>

  <div class="language">

    <button type="button" data-lang="fr">FR</button>

    <span class="sep">/</span>

    <button type="button" data-lang="en">EN</button>

    <span class="sep">/</span>

    <button type="button" data-lang="nl">NL</button>

  </div>

  <div class="edition">The Edit · Autumn ’26</div>

</header>


<!-- HERO -->

<section class="hero">

  <img
    src="Hotel Barriere. hero.webp"
    alt="Hôtel Barrière Le Normandy in Deauville">

  <div class="hero-content">

    <div
      class="category"
      id="category">
    </div>

    <h1 id="title"></h1>

  </div>

</section>


<!-- ARTICLE -->

<main class="article">

  <div id="articleBody"></div>


  <!-- MEMBER BENEFITS -->

  <section class="benefits">

    <div
      class="benefits-title"
      id="benefitsTitle">
    </div>

    <ul id="benefitsList"></ul>

  </section>


  <!-- EMAIL CTA -->

  <a
    class="cta"
    id="cta"
    href="mailto:qbenelux@quintessentially.com?subject=The%20Edit%20%C2%B7%20Autumn%20%E2%80%9926%20%C2%B7%20The%20Coastal%20Retreat">
  </a>

</main>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    Quintessentially
  </div>

  <div class="footer-edition">
    The Edit · Autumn ’26
  </div>

  <div
    class="footer-small"
    id="footerText">
  </div>

</footer>


<script>

const content = {


  /* ENGLISH */

  en: {

    category: "Travel",

    title: "The Coastal Retreat",

    paragraphs: [

      "There is something about Deauville that feels untouched by time. Belle Époque villas line quiet streets, horses leave their tracks along the shore, and beyond Les Planches, the Normandy sea stretches towards a pale horizon.",

      "At Hôtel Barrière Le Normandy, the rhythm is one of understated elegance. Mornings unfold over breakfast before Deauville draws you towards the racecourse, the boutiques or the sea. As evening falls, the town takes on another character entirely.",

      "We shape the stay around the pleasures that bring people back to Deauville: a beautiful room overlooking the coast, mornings that begin at an unhurried table, days that move easily between the hotel and the town. Everything is considered with discretion, leaving Deauville to reveal itself at its own pace.",

      "Some places ask to be discovered. Deauville asks you to return."

    ],

    benefitsTitle:
      "Your Quintessentially Member Benefits",

    benefits: [

      "<strong>Guaranteed room upgrade at booking</strong>, up to a Deluxe Suite Sea View",

      "<strong>Daily breakfast for two</strong> in the hotel restaurant",

      "<strong>USD 100 hotel credit</strong> to enjoy during your stay",

      "<strong>USD 300 total hotel credit for stays of seven nights or more</strong>",

      "<strong>Early check-in and late check-out</strong>, subject to availability"

    ],

    cta:
      "Let Deauville unfold for you",

    footer:
      "Curated for members · The Edit is published monthly"

  },


  /* FRENCH */

  fr: {

    category: "Voyage",

    title: "L’Échappée en Bord de Mer",

    paragraphs: [

      "Il y a quelque chose à Deauville qui semble avoir échappé au temps. Les villas Belle Époque bordent des rues paisibles, les chevaux laissent leurs traces sur le rivage et, au-delà des Planches, la mer de Normandie s’étend vers un horizon pâle.",

      "À l’Hôtel Barrière Le Normandy, le rythme est empreint d’une élégance discrète. Les matinées commencent autour d’un petit-déjeuner avant que Deauville ne vous entraîne vers l’hippodrome, les boutiques ou la mer. À la tombée du jour, la ville révèle un tout autre caractère.",

      "Nous imaginons votre séjour autour de ces plaisirs qui donnent envie de revenir à Deauville : une belle chambre avec vue sur la côte, des matinées qui commencent sans hâte et des journées qui s’écoulent naturellement entre l’hôtel et la ville. Chaque détail est pensé avec discrétion, laissant Deauville se révéler à son propre rythme.",

      "Certains lieux demandent à être découverts. Deauville vous invite à revenir."

    ],

    benefitsTitle:
      "Vos avantages en tant que Membre Quintessentially",

    benefits: [

      "<strong>Surclassement garanti dès la réservation</strong>, jusqu’à une Deluxe Suite Sea View",

      "<strong>Petit-déjeuner quotidien pour deux</strong> au restaurant de l’hôtel",

      "<strong>Crédit hôtelier de 100 USD</strong> à utiliser pendant votre séjour",

      "<strong>Crédit hôtelier total de 300 USD pour les séjours de sept nuits ou plus</strong>",

      "<strong>Arrivée anticipée et départ tardif</strong>, sous réserve de disponibilité"

    ],

    cta:
      "Laissez Deauville se dévoiler à vous",

    footer:
      "Sélectionné pour nos membres · The Edit paraît chaque mois"

  },


  /* DUTCH */

  nl: {

    category: "Reizen",

    title: "De Kust als Toevlucht",

    paragraphs: [

      "Er is iets aan Deauville dat onaangeraakt lijkt door de tijd. Belle Époque-villa’s liggen langs rustige straten, paarden laten hun sporen achter op het strand en voorbij Les Planches strekt de Normandische zee zich uit naar een bleke horizon.",

      "In Hôtel Barrière Le Normandy draait alles om ingetogen elegantie. De ochtend begint rustig met ontbijt, waarna Deauville u naar de renbaan, de boetieks of de zee trekt. Wanneer de avond valt, krijgt de stad een heel ander karakter.",

      "We geven uw verblijf vorm rond de genoegens die mensen telkens opnieuw naar Deauville brengen: een mooie kamer met uitzicht op de kust, ochtenden die rustig aan tafel beginnen en dagen die moeiteloos tussen het hotel en de stad verlopen. Elk detail wordt discreet verzorgd, zodat Deauville zich op haar eigen tempo kan onthullen.",

      "Sommige plaatsen vragen om ontdekt te worden. Deauville vraagt u om terug te keren."

    ],

    benefitsTitle:
      "Uw Quintessentially Member Benefits",

    benefits: [

      "<strong>Gegarandeerde kamerupgrade bij reservatie</strong>, tot een Deluxe Suite Sea View",

      "<strong>Dagelijks ontbijt voor twee</strong> in het restaurant van het hotel",

      "<strong>USD 100 hoteltegoed</strong> om tijdens uw verblijf te besteden",

      "<strong>USD 300 totaal hoteltegoed bij een verblijf van zeven nachten of langer</strong>",

      "<strong>Vroege check-in en late check-out</strong>, afhankelijk van beschikbaarheid"

    ],

    cta:
      "Laat Deauville zich voor u ontvouwen",

    footer:
      "Samengesteld voor onze leden · The Edit verschijnt maandelijks"

  }

};



function showLanguage(lang){

  if(!content[lang]){
    lang = "en";
  }

  const data = content[lang];

  document.documentElement.lang = lang;

  document.getElementById("category").textContent =
    data.category;

  document.getElementById("title").textContent =
    data.title;

  document.getElementById("benefitsTitle").textContent =
    data.benefitsTitle;

  document.getElementById("cta").textContent =
    data.cta;

  document.getElementById("footerText").textContent =
    data.footer;


  /* ARTICLE */

  const articleBody =
    document.getElementById("articleBody");

  articleBody.innerHTML = "";

  data.paragraphs.forEach(function(text){

    const paragraph =
      document.createElement("p");

    paragraph.textContent = text;

    articleBody.appendChild(paragraph);

  });


  /* BENEFITS */

  const benefitsList =
    document.getElementById("benefitsList");

  benefitsList.innerHTML = "";

  data.benefits.forEach(function(text){

    const item =
      document.createElement("li");

    item.innerHTML = text;

    benefitsList.appendChild(item);

  });


  /* ACTIVE LANGUAGE */

  document
    .querySelectorAll("[data-lang]")
    .forEach(function(button){

      if(button.dataset.lang === lang){

        button.classList.add("active");

      } else {

        button.classList.remove("active");

      }

    });


  /* LANGUAGE IN URL */

  const newUrl =
    new URL(window.location.href);

  newUrl.searchParams.set("lang", lang);

  window.history.replaceState(
    {},
    "",
    newUrl
  );

}


/* LANGUAGE BUTTONS */

document
  .querySelectorAll("[data-lang]")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        showLanguage(
          button.dataset.lang
        );

      }
    );

  });


/* STARTING LANGUAGE */

const params =
  new URLSearchParams(
    window.location.search
  );

const startingLanguage =
  params.get("lang") || "en";

showLanguage(startingLanguage);

</script>


</body>
</html>
