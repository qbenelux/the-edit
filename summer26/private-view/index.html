<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where Winter Waits · The Edit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080807;
  --ink:#ece6db;
  --body:#b8b1a4;
  --muted:#8a8478;
  --line:#302819;
  --accent:#c9a961;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:Helvetica,Arial,sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--body);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
}

/* HEADER */

header{
  height:68px;
  background:#080807;
  border-bottom:1px solid #211d15;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 36px;
  position:relative;
  z-index:10;
}

.wordmark{
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--ink);
}

.language{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.22em;
}

.language button{
  background:none;
  border:none;
  color:var(--muted);
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.22em;
  cursor:pointer;
  padding:5px 7px;
}

.language button.active{
  color:var(--accent);
  border-bottom:1px solid var(--accent);
}

.language .sep{
  color:#3a3120;
}

.edition{
  font-size:15px;
  font-style:italic;
  color:var(--ink);
}


/* HERO */

.hero{
  height:430px;
  position:relative;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(5,5,4,.08) 0%,
    rgba(5,5,4,.12) 45%,
    rgba(5,5,4,.82) 100%
  );
}

.hero-content{
  position:absolute;
  z-index:2;
  left:clamp(35px,6vw,80px);
  bottom:48px;
}

.category{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.35em;
  font-size:9px;
  color:var(--accent);
  margin-bottom:12px;
}

h1{
  color:var(--ink);
  font-size:clamp(46px,5vw,68px);
  font-weight:300;
  line-height:1;
}


/* ARTICLE */

.article{
  max-width:590px;
  margin:0 auto;
  padding:70px 30px 85px;
}

.article p{
  font-size:18px;
  line-height:1.75;
  margin-bottom:25px;
  color:var(--body);
}

.article p:first-child{
  color:var(--ink);
  font-size:20px;
}


/* CTA */

.cta{
  display:inline-block;
  margin-top:10px;
  color:var(--accent);
  font-size:21px;
  font-style:italic;
  text-decoration:none;
  border-bottom:1px solid var(--line);
  padding-bottom:5px;
  transition:.25s ease;
}

.cta:hover{
  border-color:var(--accent);
}


/* FOOTER */

footer{
  border-top:1px solid #211d15;
  text-align:center;
  padding:48px 20px;
}

.footer-logo{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.42em;
  font-size:9px;
  color:var(--ink);
  margin-bottom:15px;
}

.footer-edition{
  font-style:italic;
  color:var(--muted);
  font-size:16px;
  margin-bottom:18px;
}

.footer-small{
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.14em;
  color:#716b60;
}


/* MOBILE */

@media(max-width:600px){

  header{
    padding:0 18px;
    height:64px;
  }

  .edition{
    display:none;
  }

  .language{
    position:static;
    transform:none;
  }

  .hero{
    height:480px;
  }

  .hero-content{
    left:25px;
    bottom:40px;
  }

  h1{
    font-size:46px;
  }

  .article{
    padding:55px 25px 70px;
  }
}
</style>
</head>


<body>

<header>

  <div class="wordmark">
    Quintessentially
  </div>

  <div class="language">
    <button data-lang="fr">FR</button>
    <span class="sep">/</span>
    <button data-lang="en" class="active">EN</button>
    <span class="sep">/</span>
    <button data-lang="nl">NL</button>
  </div>

  <div class="edition">
    The Edit · Autumn ’26
  </div>

</header>


<section class="hero">

  <img src="winter housee.png" alt="Winter house and festive table">

  <div class="hero-content">

    <div class="category" data-category>
      Travel
    </div>

    <h1 data-title>
      Where Winter Waits
    </h1>

  </div>

</section>


<main class="article">

  <div data-body></div>

  <a
    class="cta"
    data-cta
    href="mailto:qbenelux@quintessentially.com?subject=The%20Edit%20%C2%B7%20Autumn%20%E2%80%9926%20%C2%B7%20Where%20Winter%20Waits">
    Step into a slower winter
  </a>

</main>


<footer>

  <div class="footer-logo">
    Quintessentially
  </div>

  <div class="footer-edition">
    The Edit · Autumn ’26
  </div>

  <div class="footer-small" data-footer>
    Curated for members · The Edit is published monthly
  </div>

</footer>


<script>

const D = {

  en: {
    category: "Travel",
    title: "Where Winter Waits",
    body: [
      "Winter has its own way of bringing people together. As the days shorten and the air turns crisp, weekends become an invitation to retreat somewhere quieter, with family, close friends, and time that asks nothing of you.",
      
      "Here, the day belongs entirely to you. Stay in until evening, gather around a beautifully set table, or let dinner become the occasion itself. There is no itinerary to follow, only the pleasure of deciding how the day unfolds.",
      
      "The setting may change, from a secluded villa to a country estate or snow-covered chalet, but the feeling should remain effortless. Tell us what you have in mind, and we will quietly bring the pieces together, leaving you with nothing but the reason you came.",
      
      "This winter, let the house be private, the table full, and the time entirely yours."
    ],
    cta: "Step into a slower winter",
    footer: "Curated for members · The Edit is published monthly"
  },


  fr: {
    category: "Voyage",
    title: "Là où l’hiver vous attend",
    body: [
      "L’hiver a sa propre façon de réunir les gens. À mesure que les jours raccourcissent et que l’air se rafraîchit, les week-ends deviennent une invitation à se retirer dans un lieu plus paisible, en famille ou entre amis proches, avec du temps qui n’exige rien de vous.",
      
      "Ici, la journée vous appartient entièrement. Restez à l’intérieur jusqu’au soir, retrouvez-vous autour d’une table soigneusement dressée ou faites du dîner l’occasion elle-même. Aucun itinéraire à suivre, seulement le plaisir de décider comment la journée se déroulera.",
      
      "Le décor peut changer, d’une villa isolée à une demeure de campagne ou un chalet enneigé, mais le sentiment doit rester le même : celui d’une simplicité absolue. Dites-nous ce que vous imaginez et nous en réunirons discrètement chaque détail, afin qu’il ne vous reste que la raison de votre venue.",
      
      "Cet hiver, que la maison soit privée, la table généreuse et le temps entièrement à vous."
    ],
    cta: "Entrez dans un hiver plus lent",
    footer: "Sélectionné pour nos membres · The Edit paraît chaque mois"
  },


  nl: {
    category: "Reizen",
    title: "Waar de winter wacht",
    body: [
      "De winter heeft zijn eigen manier om mensen samen te brengen. Wanneer de dagen korter worden en de lucht frisser aanvoelt, nodigen weekends uit om zich terug te trekken naar een rustigere plek, samen met familie of goede vrienden, met tijd die niets van u vraagt.",
      
      "Hier behoort de dag volledig aan u toe. Blijf binnen tot de avond valt, kom samen rond een prachtig gedekte tafel of maak van het diner de gelegenheid op zich. Er is geen programma dat gevolgd moet worden, alleen het plezier om zelf te bepalen hoe de dag verloopt.",
      
      "De omgeving kan veranderen, van een afgelegen villa tot een landgoed of een besneeuwd chalet, maar het gevoel moet moeiteloos blijven. Vertel ons wat u in gedachten heeft en wij brengen de verschillende elementen discreet samen, zodat u zich alleen hoeft te richten op de reden waarom u gekomen bent.",
      
      "Laat deze winter het huis privé zijn, de tafel gevuld en de tijd volledig van u."
    ],
    cta: "Stap een rustigere winter binnen",
    footer: "Samengesteld voor onze leden · The Edit verschijnt maandelijks"
  }

};


function render(lang){

  const d = D[lang];

  document.documentElement.lang = lang;

  document.querySelector("[data-category]").textContent = d.category;

  document.querySelector("[data-title]").textContent = d.title;

  document.querySelector("[data-cta]").textContent = d.cta;

  document.querySelector("[data-footer]").textContent = d.footer;


  const body = document.querySelector("[data-body]");

  body.innerHTML = "";


  d.body.forEach((paragraph) => {

    const p = document.createElement("p");

    p.textContent = paragraph;

    body.appendChild(p);

  });

}


function setLang(lang){

  if(!D[lang]){
    lang = "en";
  }

  document.querySelectorAll("[data-lang]").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.lang === lang
    );

  });

  render(lang);


  const url = new URL(window.location);

  url.searchParams.set("lang", lang);

  window.history.replaceState({}, "", url);

}


document.querySelectorAll("[data-lang]").forEach(button => {

  button.addEventListener("click", () => {

    setLang(button.dataset.lang);

  });

});


const initialLang =
  new URLSearchParams(window.location.search).get("lang") || "en";

setLang(initialLang.toLowerCase());

</script>


</body>
</html>
