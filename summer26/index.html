<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Edit · Summer ’26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908;
    --ink:#ece6db;       /* headings / light */
    --body:#b8b1a4;      /* body copy */
    --muted:#8a8478;     /* labels, footer */
    --line:#3a3120;      /* hairline gold-brown */
    --accent:#c9a961;    /* champagne gold */
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--body);
    font-family:var(--serif);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,9,8,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,64px);
    gap:16px;flex-wrap:wrap;
  }
  .wordmark{
    font-family:var(--sans);font-weight:400;
    letter-spacing:0.42em;font-size:11px;text-transform:uppercase;
    color:var(--ink);white-space:nowrap;
  }
  .edition-title{
    font-family:var(--serif);font-style:italic;font-weight:300;
    font-size:clamp(15px,2.2vw,19px);color:var(--ink);white-space:nowrap;
  }
  .toggle{display:flex;align-items:center;gap:2px;}
  .toggle button{
    background:none;border:none;cursor:pointer;padding:6px 10px;
    color:var(--muted);font-family:var(--sans);font-size:11px;
    letter-spacing:0.18em;text-transform:uppercase;transition:color .3s ease;
  }
  .toggle button:hover{color:var(--ink);}
  .toggle button.active{color:var(--accent);border-bottom:1px solid var(--accent);}
  .toggle .sep{color:var(--line);}

  main{max-width:760px;margin:0 auto;padding:0 clamp(22px,6vw,40px);}

  .intro{padding:clamp(72px,13vw,140px) 0 clamp(56px,9vw,96px);text-align:center;}
  .intro .kicker{
    font-family:var(--sans);font-weight:400;letter-spacing:0.42em;
    font-size:11px;text-transform:uppercase;color:var(--accent);margin-bottom:34px;
  }
  .intro h1{
    font-weight:300;font-size:clamp(44px,10vw,84px);
    line-height:1.0;letter-spacing:0.005em;margin-bottom:38px;color:var(--ink);
  }
  .intro h1 em{font-style:italic;color:var(--accent);}
  .intro p{
    font-size:clamp(19px,2.6vw,23px);color:var(--body);
    max-width:58ch;margin:0 auto;
  }
  .rule{width:52px;height:1px;background:var(--accent);margin:clamp(48px,8vw,80px) auto;}

  .chapter{padding:clamp(20px,5vw,40px) 0;}
  .chapimg{display:block;margin-bottom:30px;}
  .chapimg img{width:100%;height:auto;display:block;border:1px solid var(--line);filter:saturate(0.92) brightness(0.94);}
  .chapter + .chapter{border-top:1px solid var(--line);}
  .eyebrow{
    display:flex;align-items:center;gap:14px;
    font-family:var(--sans);font-weight:400;letter-spacing:0.32em;
    font-size:10.5px;text-transform:uppercase;color:var(--muted);margin-bottom:22px;
  }
  .eyebrow .num{color:var(--accent);}
  .eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--line);}
  .chapter h2{
    font-weight:300;font-size:clamp(32px,6vw,52px);
    line-height:1.05;margin-bottom:30px;letter-spacing:0.004em;color:var(--ink);
  }
  .chapter p{font-size:clamp(17.5px,2.3vw,20px);color:var(--body);margin-bottom:22px;}
  .chapter p.lede{color:var(--ink);}
  .cta{
    display:inline-block;margin-top:14px;font-style:italic;
    font-size:clamp(19px,2.6vw,24px);color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:3px;text-decoration:none;
    transition:border-color .3s ease;
  }
  .cta:hover{border-color:var(--accent);}
  .slug{
    margin-top:34px;font-family:var(--sans);font-weight:400;
    font-size:11px;letter-spacing:0.12em;color:var(--muted);
  }
  .slug span{color:var(--accent);}

  footer{
    margin-top:clamp(64px,11vw,120px);border-top:1px solid var(--line);
    padding:clamp(48px,8vw,72px) clamp(22px,6vw,40px);text-align:center;
  }
  footer .mark{
    font-family:var(--sans);font-weight:400;letter-spacing:0.42em;
    font-size:10.5px;text-transform:uppercase;color:var(--ink);margin-bottom:20px;
  }
  footer .edition{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(17px,2.4vw,21px);color:var(--muted);}
  footer .fine{margin-top:26px;font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:0.14em;color:var(--muted);}

  @media (max-width:560px){
    header{justify-content:center;text-align:center;padding:14px 18px;}
    .wordmark{order:1;flex-basis:100%;}
    .toggle{order:2;}
    .edition-title{order:3;flex-basis:100%;}
  }

  [data-anim]{opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s ease;}
  [data-anim].in{opacity:1;transform:none;}
</style>
</head>
<body>
<header>
  <div class="wordmark">Quintessentially</div>
  <nav class="toggle" aria-label="Language">
    <button data-lang="fr">FR</button><span class="sep">/</span><button data-lang="en" class="active">EN</button><span class="sep">/</span><button data-lang="nl">NL</button>
  </nav>
  <div class="edition-title" id="edition-title-top">The Edit · Summer ’26</div>
</header>

<main>
  <section class="intro">
    <div class="kicker" id="intro-kicker">The August Edition</div>
    <h1 id="intro-title">The Edit · <em>Summer ’26</em></h1>
    <p id="intro-body"></p>
  </section>

  <div class="rule"></div>

  <article class="chapter" data-anim id="chap-0">
    <a class="chapimg" href="september-coast/"><img src="https://mcusercontent.com/ef9402d099265186fdcd8864a/_compresseds/754cc70e-ddb9-015e-30ac-bf150dde5b22.jpg" alt="" loading="lazy"></a>
    <div class="eyebrow"><span class="num">I</span><span class="dot"></span><span class="cat" data-cat="0"></span></div>
    <h2 data-title="0"></h2>
    <div class="body" data-body="0"></div>
    <a class="cta" href="september-coast/" data-cta="0"></a>
  </article>

  <article class="chapter" data-anim id="chap-1">
    <a class="chapimg" href="the-return/"><img src="https://mcusercontent.com/ef9402d099265186fdcd8864a/images/7574ec5b-645c-1bb4-66f2-a67bf80c1b98.jpg" alt="" loading="lazy"></a>
    <div class="eyebrow"><span class="num">II</span><span class="dot"></span><span class="cat" data-cat="1"></span></div>
    <h2 data-title="1"></h2>
    <div class="body" data-body="1"></div>
    <a class="cta" href="the-return/" data-cta="1"></a>
  </article>

  <article class="chapter" data-anim id="chap-2">
    <a class="chapimg" href="private-view/"><img src="https://mcusercontent.com/ef9402d099265186fdcd8864a/images/facce438-e329-fb2c-46d5-29338c30b500.jpg" alt="" loading="lazy"></a>
    <div class="eyebrow"><span class="num">III</span><span class="dot"></span><span class="cat" data-cat="2"></span></div>
    <h2 data-title="2"></h2>
    <div class="body" data-body="2"></div>
    <a class="cta" href="private-view/" data-cta="2"></a>
  </article>

  <article class="chapter" data-anim id="chap-3">
    <a class="chapimg" href="last-harvest/"><img src="https://mcusercontent.com/ef9402d099265186fdcd8864a/images/795a09d4-9e03-3962-a7fd-dbe7100c1e10.jpg" alt="" loading="lazy"></a>
    <div class="eyebrow"><span class="num">IV</span><span class="dot"></span><span class="cat" data-cat="3"></span></div>
    <h2 data-title="3"></h2>
    <div class="body" data-body="3"></div>
    <a class="cta" href="last-harvest/" data-cta="3"></a>
  </article>
</main>

<footer>
  <div class="mark">Quintessentially</div>
  <div class="edition" id="edition-title-bottom">The Edit · Summer ’26</div>
  <div class="fine" id="footer-fine"></div>
</footer>

<script>
const DATA = {
  en:{
    kicker:"The August Edition",
    intro:"August arrives quietly, at the hour when summer begins to loosen its hold. The light lengthens, the crowds thin, and the season turns inward, toward slower mornings and the pleasures that reveal themselves only to those who linger. This edition follows that turning: from a coast rediscovered in September, through the quiet ritual of returning, into the first cultural openings of autumn and the last harvests of the year. Four chapters, one movement, the art of arriving as others depart.",
    footer:"Curated for members · The Edit is published monthly",
    sections:[
      {cat:"Travel", title:"The September Coast", cta:"Let the season slow with you",
       body:[
        "There is a moment, somewhere after the last week of August, when the Mediterranean exhales. The parasols fold away, the harbours quiet, and the sea holds its warmth a little longer than the calendar suggests.",
        "September light falls differently here, softer, more forgiving. Lunches stretch into afternoons. A table by the water, unbookable for weeks, is suddenly yours. The coast belongs, for a while, to those who know when to come.",
        "We open the houses that reserve their finest suites for this season: a villa above Cap Ferrat, a retreat suspended over the Amalfi cliffs, a quiet address in the Aeolian islands. Each stay is tailored to the rhythm you keep, with a chef, a boat, and the introductions that turn a visit into something closer to belonging.",
        "The season does not end. It simply grows quieter, and more yours."
       ]},
      {cat:"Art of Living", title:"The Return", cta:"Ease back into your own rhythm",
       body:[
        "The return is rarely spoken of, yet everyone knows its weight, the morning the city calls you back, and summer folds itself into memory.",
        "There is a grace in coming home well. The wardrobe shifts from linen to wool, from bare to considered. Days regain their edges. The desk, the routine, the familiar streets all wait to be reclaimed rather than endured.",
        "We help you meet the season on your own terms: a wardrobe refreshed with the houses that understand restraint, a study rearranged, a calendar composed rather than filled. The small architecture of a life resumed with intention.",
        "Autumn is not a retreat from summer. It is summer, matured."
       ]},
      {cat:"Culture & Access", title:"The Private View", cta:"Step in before the doors open",
       body:[
        "Before a season is announced to the world, it is shown to a few. The gallery lit after hours, the fair walked before the doors open, the collection seen while the paint is barely dry.",
        "Autumn is when culture returns to the cities, London, Paris, the quieter capitals in between. Fairs and openings crowd the weeks, and the distance between attending and belonging is measured in access.",
        "We arrange what the calendar withholds: private views ahead of the public days, conversations with the gallerists and curators who shape the season, a seat at the dinners that follow. Where the crowd sees a queue, you find an open door.",
        "The best of a season is rarely on the wall. It is in the room before the room fills."
       ]},
      {cat:"Gastronomy", title:"The Last Harvest", cta:"Taste the turning of the season",
       body:[
        "As the vines turn and the first cold settles into the soil, the table receives its final gifts of the year.",
        "This is the season of gathering, of vendange under a low sun, of the first truffles lifted from the earth, of kitchens that cook close to the source. The flavours deepen as the days shorten.",
        "We set a place for you at the year's quietest feasts: a harvest in Burgundy walked beside the winemaker, a truffle table in Alba, a chef's counter kept for a single evening and a handful of guests. Each meal is crafted around a moment that will not return until next year.",
        "Some seasons are not remembered. They are tasted."
       ]}
    ]
  },
  fr:{
    kicker:"L'édition d'août",
    intro:"Août s'installe sans bruit, à l'heure où l'été desserre son étreinte. La lumière s'allonge, les foules s'espacent, et la saison se replie vers l'intérieur, vers les matins lents et les plaisirs qui ne se livrent qu'à ceux qui s'attardent. Cette édition suit ce basculement : d'une côte retrouvée en septembre au rituel discret du retour, jusqu'aux premières ouvertures culturelles de l'automne et aux dernières récoltes de l'année. Quatre chapitres, un même mouvement, l'art d'arriver quand les autres s'en vont.",
    footer:"Composé pour les membres · The Edit paraît chaque mois",
    sections:[
      {cat:"Voyage", title:"La Côte de Septembre", cta:"Laissez la saison ralentir avec vous",
       body:[
        "Il existe un moment, quelque part après la dernière semaine d'août, où la Méditerranée respire enfin. Les parasols se replient, les ports s'apaisent, et la mer garde sa chaleur un peu plus longtemps que le calendrier ne le laisse croire.",
        "La lumière de septembre tombe autrement, plus douce, plus indulgente. Les déjeuners s'étirent jusqu'au soir. Une table au bord de l'eau, introuvable des semaines durant, vous revient sans effort. La côte appartient, un temps, à ceux qui savent quand venir.",
        "Nous ouvrons les maisons qui réservent à cette saison leurs plus belles suites : une villa au-dessus du Cap Ferrat, un refuge suspendu sur la côte amalfitaine, une adresse tranquille aux îles Éoliennes. Chaque séjour épouse le rythme qui est le vôtre, avec un chef, un bateau et les introductions qui transforment une visite en un sentiment d'appartenance.",
        "La saison ne s'achève pas. Elle se fait seulement plus silencieuse, et plus vôtre."
       ]},
      {cat:"Art de vivre", title:"Le Retour", cta:"Retrouvez votre propre tempo",
       body:[
        "On parle rarement du retour, et pourtant chacun en connaît le poids, ce matin où la ville vous rappelle, où l'été se range doucement du côté des souvenirs.",
        "Il y a une grâce à rentrer avec justesse. La garde-robe passe du lin à la laine, du dénudé au pensé. Les journées retrouvent leurs contours. Le bureau, les habitudes, les rues familières attendent qu'on les reprenne, non qu'on les subisse.",
        "Nous vous aidons à retrouver la saison à vos conditions : une garde-robe renouvelée auprès des maisons qui entendent la retenue, un bureau réagencé, un agenda composé plutôt que rempli. La fine architecture d'une vie que l'on reprend avec intention.",
        "L'automne n'est pas un renoncement à l'été. Il en est la maturité."
       ]},
      {cat:"Culture & Accès", title:"L'Avant-Première", cta:"Entrez avant l'ouverture des portes",
       body:[
        "Avant d'être annoncée au monde, une saison se montre à quelques-uns. La galerie éclairée après la fermeture, la foire parcourue avant l'ouverture, la collection vue quand la peinture est à peine sèche.",
        "L'automne ramène la culture dans les villes, Londres, Paris, les capitales plus discrètes entre les deux. Les foires et les vernissages emplissent les semaines, et toute la distance entre assister et appartenir se mesure à l'accès.",
        "Nous organisons ce que le calendrier retient : des avant-premières avant les jours d'ouverture, des échanges avec les galeristes et les commissaires qui dessinent la saison, une place aux dîners qui suivent. Là où la foule voit une file, vous trouvez une porte ouverte.",
        "Le meilleur d'une saison est rarement sur le mur. Il est dans la pièce avant que la pièce ne se remplisse."
       ]},
      {cat:"Gastronomie", title:"La Dernière Récolte", cta:"Goûtez le basculement de la saison",
       body:[
        "Tandis que les vignes se teintent et que le premier froid gagne la terre, la table reçoit ses derniers présents de l'année.",
        "C'est la saison des vendanges sous un soleil bas, des premières truffes tirées du sol, des cuisines qui travaillent au plus près de la source. Les saveurs s'approfondissent à mesure que les jours raccourcissent.",
        "Nous vous réservons une place aux festins les plus discrets de l'année : une vendange en Bourgogne aux côtés du vigneron, une table à la truffe à Alba, un comptoir de chef gardé pour un seul soir et une poignée de convives. Chaque repas se compose autour d'un instant qui ne reviendra qu'à l'année prochaine.",
        "Certaines saisons ne se retiennent pas. Elles se goûtent."
       ]}
    ]
  },
  nl:{
    kicker:"De augustus-editie",
    intro:"Augustus komt in alle stilte, op het uur waarop de zomer haar greep laat vieren. Het licht rekt zich uit, de drukte dunt uit, en het seizoen keert naar binnen, naar trage ochtenden en genoegens die zich enkel tonen aan wie blijft dralen. Deze editie volgt die kentering: van een kust die in september wordt herontdekt, via het stille ritueel van het terugkeren, naar de eerste culturele openingen van de herfst en de laatste oogsten van het jaar. Vier hoofdstukken, één beweging, de kunst van het aankomen wanneer anderen vertrekken.",
    footer:"Samengesteld voor leden · The Edit verschijnt maandelijks",
    sections:[
      {cat:"Reizen", title:"De Kust van September", cta:"Laat het seizoen met u vertragen",
       body:[
        "Er is een moment, ergens na de laatste week van augustus, waarop de Middellandse Zee weer ademhaalt. De parasols worden opgevouwen, de havens komen tot rust, en de zee houdt haar warmte iets langer vast dan de kalender doet vermoeden.",
        "Het septemberlicht valt anders, zachter, milder. Lunches rekken zich uit tot in de avond. Een tafel aan het water, wekenlang onvindbaar, is opeens de uwe. De kust behoort een tijdlang toe aan wie weet wanneer te komen.",
        "Wij openen de huizen die hun mooiste suites voor dit seizoen bewaren: een villa boven Cap Ferrat, een verblijf hoog boven de Amalfikust, een stil adres op de Eolische eilanden. Elk verblijf voegt zich naar het ritme dat het uwe is, met een chef, een boot en de introducties die van een bezoek een gevoel van thuishoren maken.",
        "Het seizoen eindigt niet. Het wordt enkel stiller, en meer het uwe."
       ]},
      {cat:"Levenskunst", title:"De Terugkeer", cta:"Vind uw eigen ritme terug",
       body:[
        "Over de terugkeer wordt zelden gesproken, en toch kent iedereen haar gewicht, de ochtend waarop de stad u terugroept, waarop de zomer zich zacht bij de herinneringen voegt.",
        "Er schuilt gratie in een goede thuiskomst. De garderobe verschuift van linnen naar wol, van ontbloot naar doordacht. De dagen hervinden hun contouren. Het bureau, de gewoonten, de vertrouwde straten wachten om heroverd te worden, niet om ondergaan te worden.",
        "Wij helpen u het seizoen op uw eigen voorwaarden te hervinden: een garderobe vernieuwd bij de huizen die ingetogenheid verstaan, een werkkamer heringericht, een agenda gecomponeerd in plaats van gevuld. De fijne architectuur van een leven dat men met intentie hervat.",
        "De herfst is geen afscheid van de zomer. Hij is de zomer, gerijpt."
       ]},
      {cat:"Cultuur & Toegang", title:"Het Besloten Uur", cta:"Treed binnen voordat de deuren opengaan",
       body:[
        "Voordat een seizoen aan de wereld wordt aangekondigd, toont het zich aan enkelen. De galerie verlicht na sluitingstijd, de beurs doorlopen voordat de deuren opengaan, de collectie gezien terwijl de verf nog nauwelijks droog is.",
        "De herfst brengt de cultuur terug naar de steden, Londen, Parijs, de stillere hoofdsteden daartussen. Beurzen en vernissages vullen de weken, en de afstand tussen aanwezig zijn en erbij horen laat zich meten in toegang.",
        "Wij regelen wat de kalender achterhoudt: besloten previews vóór de publieke dagen, gesprekken met de galeriehouders en curatoren die het seizoen vormgeven, een plaats aan de diners die volgen. Waar de menigte een rij ziet, vindt u een open deur.",
        "Het beste van een seizoen hangt zelden aan de muur. Het bevindt zich in de zaal voordat de zaal zich vult."
       ]},
      {cat:"Gastronomie", title:"De Laatste Oogst", cta:"Proef de kentering van het seizoen",
       body:[
        "Terwijl de wijnstokken verkleuren en de eerste kou zich in de aarde nestelt, ontvangt de tafel haar laatste geschenken van het jaar.",
        "Dit is het seizoen van de pluk, van de vendange onder een lage zon, van de eerste truffels uit de grond gelicht, van keukens die dicht bij de bron werken. De smaken verdiepen naarmate de dagen korten.",
        "Wij reserveren voor u een plaats aan de stilste feesten van het jaar: een oogst in Bourgogne aan de zijde van de wijnmaker, een truffeltafel in Alba, een cheftoog gehouden voor één avond en een handvol gasten. Elke maaltijd wordt geweven rond een moment dat pas volgend jaar terugkeert.",
        "Sommige seizoenen worden niet herinnerd. Ze worden geproefd."
       ]}
    ]
  }
};

function render(lang){
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.getElementById('intro-kicker').textContent = d.kicker;
  document.getElementById('intro-body').textContent = d.intro;
  document.getElementById('footer-fine').textContent = d.footer;
  d.sections.forEach((s,i)=>{
    document.querySelector('[data-cat="'+i+'"]').textContent = s.cat;
    document.querySelector('[data-title="'+i+'"]').textContent = s.title;
    document.querySelector('[data-cta="'+i+'"]').textContent = s.cta;
    const body = document.querySelector('[data-body="'+i+'"]');
    body.innerHTML = '';
    s.body.forEach((para,pi)=>{
      const p = document.createElement('p');
      if(pi===0) p.className = 'lede';
      p.textContent = para;
      body.appendChild(p);
    });
  });
}

document.querySelectorAll('.toggle button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.lang);
  });
});

render('en');

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:0.12});
document.querySelectorAll('[data-anim]').forEach(el=>io.observe(el));
</script>
</body>
</html>
