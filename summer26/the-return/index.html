<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Edit · Summer ’26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908;--ink:#ece6db;--body:#b8b1a4;--muted:#8a8478;
    --line:#3a3120;--accent:#c9a961;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--body);font-family:var(--serif);line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  header{position:sticky;top:0;z-index:50;background:rgba(10,9,8,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,64px);gap:16px;flex-wrap:wrap;}
  .wordmark{font-family:var(--sans);font-weight:400;letter-spacing:0.42em;font-size:11px;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
  .edition-title{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(15px,2.2vw,19px);color:var(--ink);white-space:nowrap;}
  .toggle{display:flex;align-items:center;gap:2px;}
  .toggle button{background:none;border:none;cursor:pointer;padding:6px 10px;color:var(--muted);font-family:var(--sans);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;transition:color .3s ease;}
  .toggle button:hover{color:var(--ink);}
  .toggle button.active{color:var(--accent);border-bottom:1px solid var(--accent);}
  .toggle .sep{color:var(--line);}

  .hero{position:relative;width:100%;height:clamp(380px,64vh,640px);overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.9) brightness(0.92);}
  .hero .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,8,0.96) 0%,rgba(10,9,8,0.25) 45%,rgba(10,9,8,0.45) 100%);}
  .hero .cap{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(22px,6vw,64px) clamp(30px,5vw,56px);}
  .hero .eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--sans);font-weight:400;letter-spacing:0.34em;font-size:10.5px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
  .hero .eyebrow .num{color:var(--accent);}
  .hero .eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.6;}
  .hero h1{font-weight:300;font-size:clamp(38px,8vw,74px);line-height:1.02;color:var(--ink);max-width:16ch;}

  main{max-width:680px;margin:0 auto;padding:clamp(48px,8vw,88px) clamp(22px,6vw,40px) 0;}
  main p{font-size:clamp(18px,2.4vw,21px);color:var(--body);margin-bottom:24px;}
  main p.lede{color:var(--ink);font-size:clamp(20px,2.7vw,24px);}
  .cta-wrap{margin:clamp(30px,5vw,44px) 0 0;}
  .cta{display:inline-block;font-style:italic;font-size:clamp(20px,2.8vw,26px);color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px;text-decoration:none;transition:border-color .3s ease;}
  .cta:hover{border-color:var(--accent);}

  footer{margin-top:clamp(64px,11vw,120px);border-top:1px solid var(--line);padding:clamp(48px,8vw,72px) clamp(22px,6vw,40px);text-align:center;}
  footer .mark{font-family:var(--sans);font-weight:400;letter-spacing:0.42em;font-size:10.5px;text-transform:uppercase;color:var(--ink);margin-bottom:20px;}
  footer .edition{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(17px,2.4vw,21px);color:var(--muted);}
  footer .fine{margin-top:26px;font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:0.14em;color:var(--muted);}

  @media (max-width:560px){
    header{justify-content:center;text-align:center;padding:14px 18px;}
    .wordmark{order:1;flex-basis:100%;}
    .toggle{order:2;}
    .edition-title{order:3;flex-basis:100%;}
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">Quintessentially</div>
  <nav class="toggle" aria-label="Language">
    <button data-lang="fr">FR</button><span class="sep">/</span><button data-lang="en" class="active">EN</button><span class="sep">/</span><button data-lang="nl">NL</button>
  </nav>
  <div class="edition-title">The Edit · Summer ’26</div>
</header>

<div class="hero">
  <img src="https://mcusercontent.com/ef9402d099265186fdcd8864a/images/7574ec5b-645c-1bb4-66f2-a67bf80c1b98.jpg" alt="">
  <div class="veil"></div>
  <div class="cap">
    <div class="eyebrow"><span class="num">II</span><span class="dot"></span><span data-cat></span></div>
    <h1 data-title></h1>
  </div>
</div>

<main>
  <div class="body" data-body></div>
  <div class="cta-wrap"><a class="cta" data-cta href="mailto:qbenelux@quintessentially.com?subject=The%20Edit%20%C2%B7%20Summer%20%E2%80%9926%20%C2%B7%20The%20Return"></a></div>
</main>

<footer>
  <div class="mark">Quintessentially</div>
  <div class="edition">The Edit · Summer ’26</div>
  <div class="fine" data-footer></div>
</footer>

<script>
const D = {"en":{"cat":"Art of Living","title":"The Return","cta":"Ease back into your own rhythm","body":["The return is rarely spoken of, yet everyone knows its weight, the morning the city calls you back, and summer folds itself into memory.","There is a grace in coming home well. The wardrobe shifts from linen to wool, from bare to considered. Days regain their edges. The desk, the routine, the familiar streets all wait to be reclaimed rather than endured.","We help you meet the season on your own terms: a wardrobe refreshed with the houses that understand restraint, a study rearranged, a calendar composed rather than filled. The small architecture of a life resumed with intention.","Autumn is not a retreat from summer. It is summer, matured."],"kicker":"The August Edition","footer":"Curated for members · The Edit is published monthly"},"fr":{"cat":"Art de vivre","title":"Le Retour","cta":"Retrouvez votre propre tempo","body":["On parle rarement du retour, et pourtant chacun en connaît le poids, ce matin où la ville vous rappelle, où l'été se range doucement du côté des souvenirs.","Il y a une grâce à rentrer avec justesse. La garde-robe passe du lin à la laine, du dénudé au pensé. Les journées retrouvent leurs contours. Le bureau, les habitudes, les rues familières attendent qu'on les reprenne, non qu'on les subisse.","Nous vous aidons à retrouver la saison à vos conditions : une garde-robe renouvelée auprès des maisons qui entendent la retenue, un bureau réagencé, un agenda composé plutôt que rempli. La fine architecture d'une vie que l'on reprend avec intention.","L'automne n'est pas un renoncement à l'été. Il en est la maturité."],"kicker":"L'édition d'août","footer":"Composé pour les membres · The Edit paraît chaque mois"},"nl":{"cat":"Levenskunst","title":"De Terugkeer","cta":"Vind uw eigen ritme terug","body":["Over de terugkeer wordt zelden gesproken, en toch kent iedereen haar gewicht, de ochtend waarop de stad u terugroept, waarop de zomer zich zacht bij de herinneringen voegt.","Er schuilt gratie in een goede thuiskomst. De garderobe verschuift van linnen naar wol, van ontbloot naar doordacht. De dagen hervinden hun contouren. Het bureau, de gewoonten, de vertrouwde straten wachten om heroverd te worden, niet om ondergaan te worden.","Wij helpen u het seizoen op uw eigen voorwaarden te hervinden: een garderobe vernieuwd bij de huizen die ingetogenheid verstaan, een werkkamer heringericht, een agenda gecomponeerd in plaats van gevuld. De fijne architectuur van een leven dat men met intentie hervat.","De herfst is geen afscheid van de zomer. Hij is de zomer, gerijpt."],"kicker":"De augustus-editie","footer":"Samengesteld voor leden · The Edit verschijnt maandelijks"}};
function render(lang){
  const d=D[lang];
  document.documentElement.lang=lang;
  document.querySelector('[data-cat]').textContent=d.cat;
  document.querySelector('[data-title]').textContent=d.title;
  document.querySelector('[data-cta]').textContent=d.cta;
  document.querySelector('[data-footer]').textContent=d.footer;
  const b=document.querySelector('[data-body]');b.innerHTML='';
  d.body.forEach((para,i)=>{const el=document.createElement('p');if(i===0)el.className='lede';el.textContent=para;b.appendChild(el);});
}
const LANGS=['fr','en','nl'];
function setLang(lang){
  if(!LANGS.includes(lang)) lang='en';
  document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('active', x.dataset.lang===lang));
  render(lang);
}
document.querySelectorAll('.toggle button').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
setLang((new URLSearchParams(location.search).get('lang')||'en').toLowerCase());
</script>
</body>
</html>
